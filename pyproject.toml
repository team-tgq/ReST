[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rest-swe"
version = "1.0.1"
description = "ReST: Reliable Spatiotemporal Generalization for Snow Water Equivalent Forecasting"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "pandas>=2.0", "torch>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "build>=1"]

[project.urls]
Repository = "https://github.com/team-tgq/ReST"

[project.scripts]
rest-train = "rest.train:main"
rest-predict = "rest.predict:main"
rest-demo = "rest.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
